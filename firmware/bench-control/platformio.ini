[platformio]
default_envs = bench_preflight

[env]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
extra_scripts = pre:generate_baseline.py
board_upload.flash_size = 16MB
board_build.flash_mode = dio
board_build.partitions = ../heltec/partitions.csv
build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  -D CORE_DEBUG_LEVEL=0
  -I ../heltec/include
monitor_speed = 115200
upload_speed = 921600
lib_deps = h2zero/NimBLE-Arduino@2.3.7

[env:bench_preflight]
build_flags = ${env.build_flags} -D BENCH_ENABLE_MOTOR_COMMANDS=0

[env:bench_diagnostic]
build_flags = ${env.build_flags} -D BENCH_ENABLE_MOTOR_COMMANDS=1
