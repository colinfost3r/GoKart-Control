# GoKart kart Pi: Bluetooth audio must not depend on the kiosk's logind session being "active" on
# seat0. With seat monitoring on (WirePlumber's default), every kiosk restart (watchdog, deploy)
# briefly deactivates the session and WirePlumber drops the speaker.
wireplumber.profiles = {
  main = {
    monitor.bluez.seat-monitoring = disabled
  }
}
# Send-only A2DP (the Pi is the A2DP source; no headset/HFP mic profiles: the speaker is output only), and no MIDI over BLE.
monitor.bluez.properties = {
  bluez5.roles = [ a2dp_source ]
}
wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = false
}
