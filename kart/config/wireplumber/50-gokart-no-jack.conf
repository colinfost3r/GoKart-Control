# GoKart kart Pi: the 3.5 mm jack ("bcm2835 Headphones") has nothing on it. Disabling it keeps the
# default sink = the Bluetooth speaker when it is connected, else the HDMI panel's speakers.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.platform-.*mailbox" }
      { alsa.card_name = "bcm2835 Headphones" }
    ]
    actions = { update-props = { device.disabled = true } }
  }
]
