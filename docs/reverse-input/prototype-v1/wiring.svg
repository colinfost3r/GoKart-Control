<text x="400" y="795" font-size="19" font-weight="700" text-anchor="start" style="fill:#65778d">VESC SIGNAL GND — all GND connections shown here are common</text>
<rect x="45" y="851" width="810" height="177" rx="12" fill="#eaf5ef" stroke="#afcbb9" stroke-width="2" stroke-dasharray=""/>
<text x="66" y="888" font-size="23" font-weight="700" text-anchor="start" style="fill:#182b43">What it does</text>
<text x="66" y="923" font-size="20" font-weight="400" text-anchor="start" style="fill:#182b43">Switch ON → about 9–10 mA loop → PPM LOW → REVERSE</text>
<text x="66" y="955" font-size="20" font-weight="400" text-anchor="start" style="fill:#182b43">Switch OFF / broken loop → PPM HIGH → FORWARD</text>
<text x="66" y="990" font-size="18" font-weight="400" text-anchor="start" style="fill:#182b43">A grounded loop wire can also request reverse. No fault diagnosis.</text>
<rect x="878" y="851" width="827" height="177" rx="12" fill="#edf2fa" stroke="#b0bfd4" stroke-width="2" stroke-dasharray=""/>
<text x="900" y="888" font-size="23" font-weight="700" text-anchor="start" style="fill:#182b43">Before connecting the VESC signal</text>
<text x="900" y="922" font-size="19" font-weight="400" text-anchor="start" style="fill:#182b43">Test levels, both switch positions and power cycling on the bench.</text>
<text x="900" y="954" font-size="19" font-weight="400" text-anchor="start" style="fill:#182b43">PPM reverse needs ADC and UART + Current Reverse Button.</text>
<text x="900" y="986" font-size="19" font-weight="400" text-anchor="start" style="fill:#182b43">Servo output OFF. Preserve Hall / pedal calibration. See README.</text>
<text x="45" y="1060" font-size="18" font-weight="400" text-anchor="start" style="fill:#53677d">Not an emergency-stop or direction interlock. Shared grounds mean this is not a galvanically isolated system. No Heltec / Core2 connection.</text>
