<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1024, height=600, initial-scale=1, user-scalable=no">
<link rel="icon" href="data:,">
<title>GoKart Pit Kiosk</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/font-segments.css">
<link rel="stylesheet" href="/static/display-theme.css">
<link rel="stylesheet" href="/static/retro.css">
</head>
<body class="kiosk" data-page="kiosk">
<div class="topbar">
  <span class="title">PIT</span>
  <span id="simBanner" class="banner sim hidden">SIMULATION</span>
  <span id="linkChip" class="chip">T-Beam ?</span>
  <span id="radioChip" class="chip">radio ?</span>
  <span id="repChip" class="chip">no repeater</span>
  <span id="corrChip" class="chip" title="pit radio fix vs the surveyed pit marker; tap to apply/stop applying">GPS corr off</span>
  <span id="paceChip" class="chip bad hidden"></span>
  <span id="healthChip" class="chip hidden"></span>
  <span id="raceChip" class="chip">race off</span>
  <button id="gameChip" class="chip gamechip off">GAME OFF</button>
  <span class="spacer"></span>
  <button type="button" class="display-open" data-display-open>Display</button>
  <button id="sndBtn" class="chip sndchip" aria-label="sound">SOUND</button>
  <button id="fOnline" class="toggle">Online</button>
  <button id="fEntered" class="toggle">Entered</button>
  <span id="hiddenNote" class="sm"></span>
  <span id="clock" class="sm"></span>
</div>
<div id="connBanner" class="banner bad hidden"></div>
<div class="fleetbar">
  <button id="stopAll" class="hold stopall">STOP ALL<small>hold 1 s</small></button>
  <button id="startAll" class="hold startall">START ALL<small>hold 1 s</small></button><button id="slowAll" class="hold slowall">SLOW ALL<small>hold 1 s</small></button><button id="boostAll" class="hold boostall">BOOST ALL<small>hold 1 s</small></button>
  <button data-allmode="0">ALL<br>ECO</button>
  <button data-allmode="1">ALL<br>NORMAL</button>
  <button data-allmode="2">ALL<br>SPORT</button>
</div>
<div class="main">
  <div id="cards" class="cards"></div>
  <div class="right">
    <div class="tabs">
      <button data-tab="map" class="sel">MAP</button>
      <button data-tab="cmds">CMDS</button>
      <button data-tab="race">RACE</button>
      <button data-tab="log">LOG</button>
    </div>
    <div id="tab-map" class="tabpane mapwrap panel" style="padding:0">
      <canvas id="map" class="map"></canvas>
      <div class="mapctl"><button data-zoom="in">+</button><button data-zoom="out">&minus;</button><button data-zoom="fit">Fit</button></div>
    </div>
    <div id="tab-cmds" class="tabpane panel hidden"><div id="outcomes"></div></div>
    <div id="tab-race" class="tabpane panel hidden"><h3 class="laph">Laps</h3><div id="laps"></div><div id="race"></div></div>
    <div id="tab-log" class="tabpane panel hidden"><div id="baseStat" class="sm basestat"></div><div id="log" class="log"></div></div>
  </div>
</div>
<div id="sheet" class="sheet hidden"><div class="inner" id="sheetInner"></div></div>
<script src="/static/watch.js"></script>
<script src="/static/sound.js"></script>
<script src="/static/app.js"></script>
<script src="/static/display.js"></script>
</body>
</html>
