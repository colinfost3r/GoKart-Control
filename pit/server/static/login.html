<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GoKart Pit Login</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="login">
<form method="post" action="/login">
  <h2 style="margin:0">GoKart Pit</h2>
  <div id="bad" class="faultline hidden">Wrong password.</div>
  <label class="lbl" for="name">Your name (shown in the command log)</label>
  <input id="name" name="name" autocomplete="nickname" maxlength="24" placeholder="operator">
  <label class="lbl" for="pw">Pit password</label>
  <input id="pw" name="password" type="password" autocomplete="current-password" autofocus>
  <button type="submit">Log in</button>
</form>
<script>
if (location.search.indexOf("bad=1") >= 0) document.getElementById("bad").classList.remove("hidden");
</script>
</body>
</html>
